name: hr_employee_app
description: Synergy HRM Employee App
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  intl: ^0.20.3
  local_auth: ^3.0.2
  file_picker: ^12.1.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/synergy-icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/synergy-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.webp
    - assets/synergy-logo.png
    - assets/synergy-icon.png
